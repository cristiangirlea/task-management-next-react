name: CI

# Runs only on our own runners (the infra repo's lab-<repo> scale set, named by the CI_RUNNER
# variable), never on GitHub's: every job is skipped while CI_RUNNER is unset, and for a pull
# request from a fork, whose code must not reach those runners.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: Branch, tag or commit of task-management-app to run the browser tests against
        default: master

# A newer push to a pull request replaces its queued or running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  image:
    name: Build and run the production image
    if: vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: task-management-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Serve a page
        run: |
          docker run -d --name web -p 3000:3000 task-management-web:ci
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          docker logs web
          curl -sf http://127.0.0.1:3000/login | grep -q '/_next/static/'
          # The image must be built for the relative "/api", not the local-dev default.
          if docker exec web grep -rlq 'localhost:8000' .next/static; then echo "dev API URL compiled into the bundle"; exit 1; fi

  # Browser tests: the production build (NEXT_PUBLIC_API_URL=/api) and the real
  # Laravel API on one origin, as in production. See e2e/README.md.
  e2e:
    name: Browser tests
    if: vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the API
        uses: actions/checkout@v7
        with:
          repository: cristiangirlea/task-management-app
          ref: ${{ inputs.api_ref || 'master' }}
          path: api

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath
          coverage: none
        env:
          runner: self-hosted

      - name: Install the API
        working-directory: api
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the browser tests
        run: npm run e2e:build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npm run e2e
        env:
          E2E_API_DIR: api

      - name: Keep the report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            api/storage/logs/
          retention-days: 7
